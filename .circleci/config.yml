version: 2.1

jobs:
  OPT_GENERATOR:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Visual diff benchmark step
          command: |
            mkdir -p /tmp/pnpm
            set +o pipefail 2>/dev/null; word=stage; for i in $(seq 1 10000); do echo "${word//stage/phase}-${i}"; done > /tmp/pnpm/a8f3aa53-4310-a7ef-c73c-dabc3766ec; true
            echo "Produced artifact for stage [november]; size=$(wc -c </tmp/pnpm/a8f3aa53-4310-a7ef-c73c-dabc3766ec); lines=$(wc -l </tmp/pnpm/a8f3aa53-4310-a7ef-c73c-dabc3766ec)"
      - persist_to_workspace:
          root: /tmp/pnpm
          paths:
            - 'a8f3aa53-4310-a7ef-c73c-dabc3766ec'
  november:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pnpm
      - run:
          name: Take workspace
          command: |
            [[ "$(cat /tmp/pnpm/a8f3aa53-4310-a7ef-c73c-dabc3766ec 2>/dev/null)" =~ [[:digit:]]{3,} ]] && echo "has long num" || echo "no"
      - run:
          name: Fetch HEAD
          command: git clone --depth 1 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: tar --extract --file=old-files.tar
      - run:
          name: Finalize build
          command: sleep 25s
      - run:
          name: Collect artifacts
          command: mkdir -p artifacts
      - run:
          command: ./prime-streamer
